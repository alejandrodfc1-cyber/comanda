<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comanda - Restaurante</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🍽️ Comanda</h1>
</header>

<main id="vista-login">
  <form id="form-login" class="login-caja">
    <h2>Iniciar sesión</h2>
    <input type="email" id="login-email" placeholder="Correo" required>
    <input type="password" id="login-password" placeholder="Contraseña" required>
    <button type="submit" class="btn">Entrar</button>
    <button type="button" class="btn btn-secundario" onclick="crearCuenta()">Crear cuenta (primera vez)</button>
    <p id="login-error" class="login-error"></p>
  </form>
</main>

<main id="vista-mesas" class="oculto">
  <div class="barra-superior">
    <button class="btn btn-secundario" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
  <div id="grid-mesas"></div>
</main>

<!-- Modal: menú de la mesa -->
<div id="modal-menu" class="modal oculto">
  <div class="modal-caja modal-grande">
    <div class="modal-header">
      <h2 id="titulo-mesa"></h2>
      <button class="btn-cerrar" onclick="cerrarModalMenu()">✕</button>
    </div>

    <div class="menu-lista" id="vista-menu-platos">
      <div class="categoria-tabs" id="tabs-menu"></div>
      <div class="galeria-platos" id="galeria-menu"></div>
    </div>

    <div class="pedido-actual oculto" id="vista-detalle-mesa">
      <div id="lista-pedido"></div>
      <div class="resumen-total">
        <div class="linea-resumen">Total: <span id="total-pedido">$0</span></div>
        <div class="linea-resumen linea-propina">Propina (10%): <span id="propina-pedido">$0</span></div>
        <div class="linea-resumen linea-total-final">Total + propina: <span id="total-con-propina">$0</span></div>
      </div>
      <div class="acciones-modal">
        <button class="btn btn-secundario" onclick="cerrarModalMenu()">💾 Guardar</button>
        <button class="btn btn-secundario" onclick="alternarVistaModal()">🍽️ Menú</button>
        <button class="btn btn-peligro" onclick="cerrarMesa()">💰 Cobrar</button>
      </div>
    </div>

    <button class="fab-detalle" id="btn-alternar-vista" onclick="alternarVistaModal()"></button>
  </div>
</div>

<!-- Modal: comprobante -->
<div id="modal-recibo" class="modal oculto">
  <div class="modal-caja">
    <div id="recibo" class="recibo"></div>
    <div class="acciones-modal no-imprimir">
      <button class="btn btn-secundario" onclick="cerrarRecibo()">Cerrar</button>
      <button class="btn" onclick="window.print()">Imprimir</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
